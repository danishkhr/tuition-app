<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tuition App Prototype</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
        background: #f5f7fb;
        color: #1f2937;
    }

    .center {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 24px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 380px;
    }

    h1 {
        font-size: 20px;
        margin-bottom: 6px;
    }

    p {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 18px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    /* Dashboard */
    .dashboard {
        display: none;
        padding: 20px;
        max-width: 1000px;
        margin: auto;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
    }

    .box {
        background: white;
        padding: 16px;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .title {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 6px;
    }

    .value {
        font-size: 16px;
        font-weight: 600;
    }

    .pay-btn {
        margin-top: 10px;
        background: #10b981;
    }

    .pay-btn:hover {
        background: #059669;
    }

    .logout {
        background: #ef4444;
        padding: 8px 12px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-size: 12px;
    }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="center" id="loginPage">
    <div class="card">
        <h1>Welcome Back</h1>
        <p>Parent Portal Login</p>
        <input type="text" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="topbar">
        <h2>Parent Dashboard</h2>
        <div class="logout" onclick="logout()">Logout</div>
    </div>

    <div class="grid">
        <div class="box">
            <div class="title">Child</div>
            <div class="value">Ali & Sarah</div>
        </div>

        <div class="box">
            <div class="title">Today Class</div>
            <div class="value">Math - 7PM</div>
        </div>

        <div class="box">
            <div class="title">Payment Status</div>
            <div class="value">Pending</div>
            <button class="pay-btn">Pay Now</button>
        </div>

        <div class="box">
            <div class="title">Attendance</div>
            <div class="value">Good (92%)</div>
        </div>

        <div class="box">
            <div class="title">Announcements</div>
            <div class="value">Exam next week</div>
        </div>

        <div class="box">
            <div class="title">Receipt</div>
            <div class="value">Download available after payment</div>
        </div>
    </div>
</div>

<script>
function login() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
}

function logout() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
}
</script>

</body>
</html>
